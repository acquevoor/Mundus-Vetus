l_english:
 # Mundus Vetus custom estates
 estate_sea_nomads:0 "Sea Nomads"
 estate_sea_nomads_desc:0 "The Orang Laut and Sama-Bajau sea peoples live upon the waters of the archipelago. Rulers who honor them are rewarded with sailors, war fleets and command of the sea lanes; slighted, they turn to piracy."
 sea_nomads_loyalty_modifier:0 "Sea Nomads Loyalty Equilibrium"
 sea_nomads_influence_modifier:0 "Sea Nomads Influence"
 sea_nomads_privilege_slots:0 "Sea Nomads Max Privileges"
 estate_jats_banjara:0 "Jats and Banjara"
 estate_jats_banjara_desc:0 "The Jat peasant-soldiers till the land and fill the ranks of our armies, while the Banjara caravans carry grain and salt across the subcontinent, supplying hosts on the march."
 jats_banjara_loyalty_modifier:0 "Jats and Banjara Loyalty Equilibrium"
 jats_banjara_influence_modifier:0 "Jats and Banjara Influence"
 jats_banjara_privilege_slots:0 "Jats and Banjara Max Privileges"
 estate_secret_society:0 "Secret Society"
 estate_secret_society_desc:0 "The initiation societies of the forest, such as the Poro and Sande, govern law, justice and custom from behind the mask. No chief rules long against their will."
 secret_society_loyalty_modifier:0 "Secret Society Loyalty Equilibrium"
 secret_society_influence_modifier:0 "Secret Society Influence"
 secret_society_privilege_slots:0 "Secret Society Max Privileges"
 estate_bedouins:0 "Bedouins"
 estate_bedouins_desc:0 "The nomadic tribes of the desert herd camels, guide and guard the caravans, and furnish swift cavalry - or raid the settled lands when their loyalty wavers."
 bedouins_loyalty_modifier:0 "Bedouins Loyalty Equilibrium"
 bedouins_influence_modifier:0 "Bedouins Influence"
 bedouins_privilege_slots:0 "Bedouins Max Privileges"
 estate_jews:0 "Jews"
 estate_jews_desc:0 "Jewish communities knit together far-flung trade networks and serve the crown as financiers, physicians and advisors, in exchange for the protection of their communities."
 jews_loyalty_modifier:0 "Jews Loyalty Equilibrium"
 jews_influence_modifier:0 "Jews Influence"
 jews_privilege_slots:0 "Jews Max Privileges"
 # Sea Nomads privileges
 estate_sea_nomads_land_rights:0 "$ESTATE_NAME$ Land Rights"
 estate_sea_nomads_land_rights_desc:0 "The Sea Nomads are granted rights over the coasts and islets they inhabit."
 estate_sea_nomads_fleet_levies:0 "Fleet Levies"
 estate_sea_nomads_fleet_levies_desc:0 "The sea peoples man our war fleets, as they once did for Srivijaya and Malacca."
 estate_sea_nomads_strait_wardens:0 "Wardens of the Straits"
 estate_sea_nomads_strait_wardens_desc:0 "The Sea Nomads patrol the straits and steer passing traders into our harbors."
 estate_sea_nomads_letters_of_marque:0 "Letters of Marque"
 estate_sea_nomads_letters_of_marque_desc:0 "We sanction the raiding fleets of the sea peoples against the commerce of our rivals."
 # Jats and Banjara privileges
 estate_jats_banjara_land_rights:0 "$ESTATE_NAME$ Land Rights"
 estate_jats_banjara_land_rights_desc:0 "The Jat zamindars are confirmed in their holdings of the land they till."
 estate_jats_banjara_peasant_soldiers:0 "Peasant Soldiers"
 estate_jats_banjara_peasant_soldiers_desc:0 "The martial Jat peasantry stands ready to fill the ranks of our armies."
 estate_jats_banjara_banjara_caravans:0 "Banjara Caravans"
 estate_jats_banjara_banjara_caravans_desc:0 "The tandas of the Banjara carry grain and salt to our armies wherever they march."
 estate_jats_banjara_bullock_trains:0 "Bullock Trains"
 estate_jats_banjara_bullock_trains_desc:0 "With a hundred thousand oxen at their command, the Banjara can supply a greater host."
 # Secret Society privileges
 estate_secret_society_land_rights:0 "$ESTATE_NAME$ Land Rights"
 estate_secret_society_land_rights_desc:0 "The society's sacred groves and lodges are placed beyond the reach of the crown."
 estate_secret_society_masked_tribunals:0 "Masked Tribunals"
 estate_secret_society_masked_tribunals_desc:0 "The society's masked elders adjudicate disputes and punish transgressors in our name."
 estate_secret_society_initiation_rites:0 "Initiation Rites"
 estate_secret_society_initiation_rites_desc:0 "Every youth passes through the society's bush schools, binding the realm in common custom."
 estate_secret_society_taboo_sanctions:0 "Taboo Sanctions"
 estate_secret_society_taboo_sanctions_desc:0 "The society may lay a taboo upon any good or market, bending trade to our advantage."
 # Bedouins privileges
 estate_bedouins_land_rights:0 "$ESTATE_NAME$ Land Rights"
 estate_bedouins_land_rights_desc:0 "The tribes are confirmed in their dirah, the grazing grounds of their herds."
 estate_bedouins_camel_cavalry:0 "Camel Cavalry"
 estate_bedouins_camel_cavalry_desc:0 "The tribes furnish swift riders inured to the hardships of the desert."
 estate_bedouins_desert_guides:0 "Desert Guides"
 estate_bedouins_desert_guides_desc:0 "Tribal guides lead our armies along the wells and safe paths of the wastes."
 estate_bedouins_caravan_protection:0 "Caravan Protection"
 estate_bedouins_caravan_protection_desc:0 "The tribes are paid to guard, rather than raid, the caravan routes."
 # Jews privileges
 estate_jews_land_rights:0 "$ESTATE_NAME$ Land Rights"
 estate_jews_land_rights_desc:0 "Jewish communities are granted quarters and holdings under royal protection."
 estate_jews_court_factors:0 "Court Factors"
 estate_jews_court_factors_desc:0 "Jewish stewards and physicians serve at court, managing the affairs of the crown."
 estate_jews_moneylending_charters:0 "Moneylending Charters"
 estate_jews_moneylending_charters_desc:0 "Chartered Jewish financiers extend credit to the crown at favorable rates."
 estate_jews_trade_diaspora:0 "Trade Diaspora"
 estate_jews_trade_diaspora_desc:0 "Family networks spanning distant ports carry our commerce far abroad."
