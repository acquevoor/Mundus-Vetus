 DARGIN_PAGAN_HERESY:0 "Dargin Heresy"
 ALPAN:0 "Alpan Heresy"
 confucianism_desc:0 "Neo-Confucian principle-learning, founded by the Cheng brothers and consolidated by Zhu Xi (1130-1200). Li - principle - is fundamental reality; everything has its principle, and all principles are ultimately one. Qi - material force - is the medium through which principle manifests. Morality is inherent in the structure of the cosmos. The central ethical dualism is Heavenly principle against human desire. The ethical program of the Great Learning runs: investigate things, extend knowledge, make thoughts sincere, rectify the mind, cultivate the self, order the family, govern the state, pacify the world. Preserve heavenly principle, extinguish human desire. Sagehood is attained gradually through cumulative study. The Four Books with Zhu Xi's commentaries served as the imperial exam curriculum from 1313 to 1905. Practice: study of the Four Books, dushu (studying), jingzuo (quiet-sitting for moral clarification), zhujing (holding reverence). The characteristic institution is the shuyuan academy - Bailu Dong, which Zhu Xi refounded in 1180, and Yuelu. Ancestor rites are structured by Zhu Xi's family ritual manual. Cheng-Zhu provides the intellectual-textual grounding for imperial state ritual. Pan-empire orthodoxy wherever literati exam culture is dominant."
 mazujiao:0 "Mazujiao"
 mazujiao_desc:0 "Faith of the southern-coast fishing and merchant communities. Apex is Mazu, the deified Fujianese girl Lin Moniang of Meizhou Island (960-987), elevated to Heavenly Consort under the Yuan-Ming and to Heavenly Empress by the Kangxi Emperor after Shi Lang's Taiwan campaign in 1684. A cross-strait and diasporic network of daughter-temples answers to the Meizhou mother-temple. Coastal deities: Royal Lords of the plague-boats sent out from Donggang, the Baosheng Emperor of medicine from Tong'an, the Sage-King who founded Zhangzhou, the Dark Warrior of the sea, the Dragon Kings of tides and typhoons, and the Water Immortals - drowned historicals like Qu Yuan and Wu Zixu. Above them the Three Pure Ones and the Jade Emperor; Guanyin appears as the Guanyin of the Southern Sea; Lord Guan as the maritime merchant's patron. Efficacy is proved through miraculous rescues. Fashi ritual masters and Daoist priests co-officiate."
 fajiao:0 "Zhengyi"
 fajiao_desc:0 "Institutional Daoism with the Three Pure Ones at the apex and the Jade Emperor running the celestial bureaucracy. Founded by Zhang Daoling in the 2nd century, continued through the hereditary Zhang Tianshi lineage seated at Mount Longhu in Jiangxi since the Song. Local deities - Chenghuang the city god, Tudi the earth lord, Zaowang the stove god - are integrated into the Daoist hierarchy. The cosmos is a navigable bureaucratic order. Ritual-service tradition: married priests, meat-eating, community-embedded - the working priest of Chinese village and city life. The priest is a technician mediating between householders and cosmic administration through jiao offerings, talismans, incantations, and memorials to celestial officials. Practice: community jiao offerings - pure-offerings for prosperity, gloomy-offerings for the dead - spirit-summoning and salvation-rites for the deceased, ordination through Longhu Shan. Serves as the institutional ritual tradition across the south, providing formal services for fashi communities, Jiangnan literati, and Sichuan basin practitioners."
 chan:0 "Chan"
 chan_desc:0 "'Separate transmission outside scripture.' Awakening through direct mind-to-mind lineage - dhyana, gong'an, kanhua. Authority is yinke, seal of transmission from master to disciple; the lineage chart replaces the canon. Song wushan shicha registry, Hongwu 1382 chan category, Japanese Gozan vs rinka. Anti-textual in theory, heaviest textual apparatus in practice."
 chuanzhujiao:0 "Chuanzhujiao"
 chuanzhujiao_desc:0 "Sichuan-basin faith of the Lord of the River. Apex is Li Bing, the Qin governor who tamed the Dujiangyan irrigation works - water-management understood as cosmos-ordering. His son is the demon-queller Erlang, of the Fengshen Yanyi. Zhang Daoling founded the Way of the Celestial Masters at Mount Heming in 142; the Most High Lord Lao remains at the apex. The underworld is unusually developed: Fengdu on the Yangzi houses the underworld capital, its Great Emperor, the Ten Kings, and the Eastern Peak. Basin insularity gives Sichuan its own bounded cosmic zone. Practice: Chuanzhu temples in every district, Erlang worship in irrigation communities that maintain the Dujiangyan, Fengdu pilgrimage for funerary and underworld rites, Sichuan Nuo exorcistic dramas, Sichuan-specific ritual manuals, and the Sichuan opera that dramatizes the religion itself."
 nuojiao:0 "Nuojiao"
 nuojiao_desc:0 "Southwestern masked-drama religion of many peoples. Core figures are Lord and Lady Nuo as progenitors, and the masked deities of the Nuo dances. Ethnic fragmentation dominates the pantheon: Bai village-ancestor cults of Dali, the Meishan upside-down hunter of the Hunan and Guangxi hunters, the Yao and She dog-hero ancestor Panhu, the Miao butterfly-mother of the Batu Song, the Tujia White Tiger God, the Yi ancestor Apu Dumu. Yao Daoism, an indigenized Zhengyi, keeps the Three Pure Ones at its apex. Mountain and water gods, ancestors, and disease-demons crowd the pantheon. Ritual-technical rather than doctrinal; shamans are preserved. Practice: Nuo dramas at New Year and moments of crisis, hereditary Nuo-Lord and shigong priests, Meishan hunter ordinations, Bai Benzhu festivals, water-buffalo and chicken sacrifice, spirit-mediumship and spirit-writing for healing."
 wudaxian:0 "Wudaxian"
 wudaxian_desc:0 "Northeastern faith of the Five Great Immortals: the fox, the weasel, the hedgehog, the snake, and the rat, with the Third Elder of the Fox at the head of its hierarchy. Manchu substrate persists: the sky-god Abkai Enduri, the Weceku household ancestors, Fodo Mama the childbirth deity, the mountain god of Changbai as the Aisin Gioro ancestral spirit, and the deified Nurhaci as Old Khan. Han overlay from the Chuang Guandong migration adds Lord Guan and Guanyin. Ethics turn on reciprocity: spirits choose their mediums, and mediums who refuse them suffer. Moral ambivalence is distinctive - the fox crosses human and animal, gender, help and harm. Efficacy, not truth, is the test. Practice: chuma mediums for healing, divination, and exorcism; household altars with tea, liquor, and incense; Manchu rites of Weceku tablets and spring-and-fall sacrifices at the spirit-pole; Qing imperial shamanism at Kunning Palace."
 WHITE_LOTUS:0 "White Lotus Heresy"
 WANGYE:0 "Wangye Heresy"
 MEISHAN:0 "Meishan Heresy"
 WUTONG:0 "Wutong Heresy"
 FIVE_PECKS:0 "Five Pecks of Rice Heresy"
 PANHU:0 "Panhu Heresy"
 CHUMASHEN:0 "Chumashen Heresy"
 mahayana:0 "Mahayana"
 mahayana_desc:0 "Open Chinese canon, still growing. Panjiao ranks rival scriptures instead of rejecting them - subordination without heresy. Bodhisattva path, universal Buddha-nature, ekayana. Institutionally a chartered state corporation: tax-privileged temple-estates, armed men, ordination certificates sold and revoked by the throne. Registered, ranked, defrockable."
 buddhism_desc:0 "Closed Pali canon; authority commentarial (Buddhaghosa). Arahantship by self-effort; Buddha departed, uninvokable. No doctrinal court - legitimacy is ordination-lineage and sima validity; the king purifies the sangha. Sharpest monk-lay divide; one-way merit economy. Reform imports valid upasampada from Lanka."
 vajrayana_desc:0 "Tibetan canon split Kangyur (word) / Tengyur (commentary). Fruit-vehicle: Buddhahood as path, deity yoga, one lifetime. Gated by abhiseka, not ordination - secrecy structural. Tulku transmits authority by rebirth; mchod-yon binds lama and foreign emperor outside vassalage. Shingon holds the method without the succession."
 jingtu:0 "Jingtu"
 jingtu_desc:0 "Tariki: merit received, not earned, because mappo has made self-effort futile. Monk-lay boundary collapses - hereditary married clergy, dues not alms, congregation not sangha. Nembutsu is universal and doesn't define the religion; autonomous lay congregation with own clergy and revenue does. The one Buddhism that constitutes a polity without a state."
 IKKO:0 "Ikko-ikki Heresy"
 hyang:0 "Hyang"
 hyang_desc:0 "The native reverence of ancestral and nature spirits (Hyang) practised across Java in the Mundus Vetus world."
 haring:0 "Haring"
 haring_desc:0 "The native Dayak ancestor-spirit faith of Borneo, honouring the Haring guardians of forest and river, in the Mundus Vetus world."
 HYANG_HERETIC:0 "Kejawen Deviants"
 HARING_HERETIC:0 "Kaharingan Deviants"
 quanzhen:0 "Quanzhen"
 quanzhen_desc:0 "Monastic Daoism founded by Wang Chongyang (1113-1170) and his Seven Perfected disciples. Shares the Three Pure Ones apex with Zhengyi but adds a distinctive doctrine: the unity of the three teachings - Confucianism, Buddhism, Daoism as one path - and an internal-alchemical view in which the body is a microcosm. Cultivation refines essence into breath into spirit. Lu Dongbin is especially venerated as founding transmitter. The Longmen branch, born of Qiu Chuji's 1222 audience with Genghis Khan, becomes dominant under the Qing, seated at Baiyun Guan in Beijing. Monastic-mystical: celibacy, vegetarianism, poverty, meditation. The focus is neidan, internal alchemy - unifying nature and life-destiny through cultivation stages toward immortality. Open to Buddhist meditation and Confucian ethics under the three-teachings doctrine. Practice: ordination at Baiyun Guan or branch monasteries, Longmen ordination sequences, daily monastic life of dawn and evening services, meditation, text study, work. Sacred mountains: Wudang, Kunlun, Laoshan. Qing court patronage flows through Baiyun Guan."
 lu_wang:0 "Xinxue"
 lu_wang_desc:0 "Neo-Confucian mind-heart learning, founded by Lu Jiuyuan (1139-1193) and consolidated by Wang Yangming (1472-1529). Where Cheng-Zhu makes principle fundamental, Lu-Wang makes the mind-heart fundamental. Lu: mind is principle. Wang: nothing exists outside the mind. Cosmos and self interpenetrate; the sage's mind embraces all things. The doctrine of innate moral knowledge holds that every person already knows right from wrong at their core, and cultivation means actualising this innate knowing. The unity of knowledge and action follows: genuine knowing is acting. Sagehood is accessible immediately, not gradually - a democratic implication that any person can become a sage. Wang's Chuanxi Lu is the foundational text; the radical late-Ming heirs are Li Zhi and the Taizhou school. Practice: self-examination through watchfulness alone, quiet-sitting for the recognition of innate knowing, and tempering through daily affairs. Wang taught actively while pacifying bandits in Guangxi - philosophy in action. Academic sites: Yangming Shuyuan, Yaojiang Shuyuan. Regional concentrations: Jiangnan late Ming, parts of Fujian, Zhejiang, some Guangdong. Waned under the Qing evidential critique but persisted in idiosyncratic literati and Ming loyalist scholars."
 LONGMEN:0 "Longmen Heresy"
 TAIZHOU:0 "Taizhou Heresy"
 bimoism:0 "Bimoism"
 bimoism_desc:0 "Ancestral shamanism of the Yi peoples, mediated by the hereditary bimo priesthood. Bimo means teacher-of-scriptures - the bimo chant Yi-script ritual manuscripts to summon ancestors and negotiate with mountain, water, and disease spirits. Cosmology: a three-tiered universe of heaven, earth, and underworld, populated by patrilineal ancestral spirits, nature deities, and demonic sini. Apu Dumu (Zhonqmot) heads the founding ancestral line. Distinct from the household suni shaman who works through possession trance - the bimo works from written scripture. Practice: funerary guidance rites (Nimucuo), disease exorcism, animal sacrifice, ancestor tablet enshrinement, harvest and hunting offerings. Regional core: the Liangshan basin and adjacent Yunnan-Guizhou plateaus."
 moism:0 "Moism"
 moism_desc:0 "Ancestral faith of the Zhuang peoples, mediated by shigong priests and mopo mediums. Cosmology centres on Buluotuo, the creator-ancestor of Zhuang mythology, and Cangzu the mother goddess; below them a crowded pantheon of village founding-ancestors, mountain lords, water dragons, and rice-field spirits. Ritual manuscripts in the old Zhuang Sawndip script preserve the Buluotuo epic and shigong liturgies. Practice: household ancestor altars, village-boundary sacrifices, weather-summoning and disease-quelling rites, ox and chicken offerings, the third-lunar-month Sanyuesan song festivals as ritual courtship and community renewal. Concentrated in Guangxi and extending into eastern Yunnan and Guizhou."
 SUNI:0 "Suni Heresy"
 BULUOTUO:0 "Buluotuo Heresy"
