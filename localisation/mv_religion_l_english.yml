 shendao:0 "Shendao"
 shendao_desc:0 "Northern-Chinese vernacular umbrella of many traditions. Apex: the Jade Emperor as administrator, the Three Pure Ones as the remote authority, the Queen Mother of the West. Principal cults are Lord Guan of loyalty and oath (anchored at Xiezhou in Shanxi), Bixia Yuanjun of Mount Tai as fertility mother, and Guanyin in her child-granting form. The underworld tribunal of the Ten Kings sits under the Great Emperor of the Eastern Peak, with each city's Chenghuang as local magistrate. Household gods: Earth Lord, door gods, the Stove God who reports to Heaven each New Year, and the Five Directions. Functional cults cover medicine, literature, warfare, and wealth. A millenarian sectarian strand centered on the Eternal Unborn Mother threads through the whole. Praxis outranks doctrine."
