l_english:
 sand_flat:0 "Reclamation of Land"
 desc_sand_flat:0 "Sand Land is a unique planting field in the Pearl River Estuary that is reclaimed from tidal flats. A tidal flat is enclosed by a wall. When the tide of the Pearl River Estuary rises, the wall gate is lowered so that water cannot be poured into the wall. When the riverbed is higher than the low tide level, the water from the highlands is discharged, and the sand is woven into land for a long time, and the sand fields are transformed, or Dig deep for ponds and pile up for base planting."
 amber_city:0 "Amber Mine"
 desc_amber_city:0 "There are a large number of amber deposits along the coast of the Baltic Sea, and Konigsberg has the world's largest amber deposit, which is estimated to account for 90% of the world's reserves. It is a well-deserved \"Amber Capital\".\nFrom 4500 BC to 1700 BC, a large number of amber deposits were discovered on the coast of the Baltic Sea. People carried out preliminary mining and processing of amber, and the world's first amber processing center was also established here. Since 2000 BC, the \"Amber Road\" has extended from the Baltic Sea to the Mediterranean Sea, and later the Baltic Sea amber was exported to Asia along the Silk Road.\nAs a precious gem, amber mining has brought rich benefits to the people of Konigsberg and the entire Baltic Sea coast."
 patrol_division_of_penghu:0 "Penghu Cruising Office"
 desc_patrol_division_of_penghu:0 "During the Tang and Song Dynasties, more and more people crossed the sea to survive because of the war. In the Yuan Dynasty, more Han people came to Penghu. They had built thatched huts here, lived a settled life, and formed a settlement society. After the mainland Chinese pioneered Penghu, they began to develop to Taiwan Island. Yuan Ting set up an inspection department in Penghu to supervise the local people after realizing it.\nIn the Ming Dynasty, because of the implementation of the sea ban policy, Ming Taizu abolished the institution. But now the Penghu Inspection Division has been re-established to stop Japanese pirates and smuggled merchant ships, protect Chinese fishermen, handle immigration management in Penghu and Taiwan, and safeguard my country's maritime rights over the South China Sea."
 the_home_of_the_colored_glass:0 "Birthland of sino glass"
 desc_the_home_of_the_colored_glass:0 "\"Are you a rich man, and are they not savvy?\"\nIn the years of Minghuwu, in addition to an \"outside factory\" for court production and other tributes such as 'green curtain'. The mass-produced glass is also growing on Boshanxi Metallurg Street with a furnace4The production of water rumor and the product, after adding beads lamps to balls screening products such as chessboard games or pawnings."
 ritual_of_furnace_occupation:0 "Luhang church"
 desc_ritual_of_furnace_occupation:0 "Legend has it that Nuwa once smelted five-colored stones to fill the sky, and Liuli also fired \"five-colored stones\", so the Furnace Guild recognized the Nuwa as the \"grandfather\" of Furnace. In the forty-sixth year of Wanli in Ming Dynasty (1618), Sun Yanshou, Fang Zongyi and Xu Yingyuan, headed by three people, invited 23 people to form a \"furnace pilgrimage meeting\". They stipulated that the third day of the third lunar month of each year was the day to worship the ancestors. On this day, the whole furnace shop would be closed down, and the worship activities would be held together in the furnace temple. Furnace craftsmen can come to the temple to drink and have fun on this day and celebrate the festival. This kind of industrial sacrificial activity has been followed from generation to generation, and gradually formed the custom of \"furnace temple meeting\" on the third day of the third lunar month in Boshan."
 nephrite:0 "Kungang jade"
 desc_nephrite:0 "Akbar Chidayi: \"In China, there is no commodity more expensive than jade.\"\nXinjiang jade is the leader in the Chinese jade group, among which Xinjiang Hetian jade is the most famous. There is a saying in \"Thousand-Character Text\" that \"Gold is born in Lishui, and jade is born in Kungang\". Since the mid-15th century, Hetianshan material jade has been mined on a large scale. The background of the large-scale mining of raw jade in Hetian Mountain is that the demand for jade from all social classes in Ming Dynasty increased greatly. In the trade between the Western Regions and the mainland, jade has become the most important commodity. Hetian jade was called \"Jade of Kunshan\" and \"Jade of Khotan\" in ancient times. It was not until the Qing Dynasty that it was called \"Hetian jade\" because of the naming of Hetian area."
 turquoise_mine:0 "Turquoise Mine"
 desc_turquoise_mine:0 "The Sinai Peninsula in Egypt is the oldest turquoise producing area in the world. The mined turquoise is made into various ornaments, which are important ornaments for the royal family in ancient Egypt. Mining production is less, which also makes it valuable and rare."
 rebuild_the_patrol_division_of_penghu_title:0 "Reset the Penghu Cruising Office"
 rebuild_the_patrol_division_of_penghu_desc:0 "During the Southern Song Dynasty, Penghu was under the jurisdiction of Jinjiang County, Quanzhou Prefecture. Since the Yuan Dynasty, the Celestial Dynasty has set up inspection departments and other agencies in Penghu to manage the local cross-sea immigration, but in the fifth year of Hongwu, Ming Taizu moved the residents of the land of Penghu to Quanzhou and Zhangzhou, and in the seventeenth year of Hongwu In 2008, the Penghu Inspection Division was abolished because of the sea ban. Now, my country's coast has been invaded by Japanese pirates. In order to maintain the safety of my country's coastal areas, and at the same time, the reset of the Penghu Inspection Department will be put on the agenda."

 
