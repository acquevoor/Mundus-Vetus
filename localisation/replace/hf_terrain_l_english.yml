 great_wall: "the Great Wall"
 great_wall_desc: "The Great Wall is the name given to the vast wall or military works built by ancient China to defend against the invasion of the nomadic tribes of the northern part of the country at various times. The Great Wall stretches for tens of thousands of miles from east to west, so it is also called 'Wan Li Changcheng'."
